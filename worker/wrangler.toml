name = "deadballs-2"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Static game files come from ../public, so a single Worker deployment serves
# both the page and the multiplayer rooms.
[assets]
directory = "../public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[durable_objects]
bindings = [{ name = "ROOMS", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
